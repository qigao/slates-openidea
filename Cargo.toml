[package]
name = "slates-openidea"
version = "0.1.3"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jsonc-parser = { version = "0.34", features = ["serde"] }
openidea-plugin = { git = "https://github.com/l0ng-ai/openidea", tag = "v0.1.40" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
