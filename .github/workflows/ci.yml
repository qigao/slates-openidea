name: Plugin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Test and compile WebAssembly
        run: |
          rustup target add wasm32-wasip2
          cargo test --locked
          cargo build --locked --release --target wasm32-wasip2
          mkdir -p dist
          cp target/wasm32-wasip2/release/slates_openidea.wasm dist/plugin.wasm
      - name: Install OpenIDEA's plugin checker
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/l0ng-ai/openidea/releases/download/v0.1.40/openidea-plugin-linux-x86_64.gz \
            --output "$RUNNER_TEMP/openidea-plugin.gz"
          echo "24ee120405fabe75b7404fbe57d39091385fd5a06361103a22596d87212e8fa0  $RUNNER_TEMP/openidea-plugin.gz" | sha256sum --check
          gzip --decompress "$RUNNER_TEMP/openidea-plugin.gz"
          chmod +x "$RUNNER_TEMP/openidea-plugin"
      - name: Validate and package
        run: |
          (cd dist && "$RUNNER_TEMP/openidea-plugin" pack ..)
          "$RUNNER_TEMP/openidea-plugin" check dist/*.oiplugin
      - uses: actions/upload-artifact@v6
        with:
          name: slate-openidea
          path: dist/*.oiplugin
          if-no-files-found: error
